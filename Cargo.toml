[package]
name = "mtzd-vector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.36"
egui-phosphor = "0.14.0"
flate2 = "1.1.11"
fontdb = "0.24.0"
hyphenation = { version = "0.8", features = ["embed_all"] }
i_overlay = "9.1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "avif"] }
kurbo = { version = "0.13.1", features = ["serde"] }
libc = "0.2"
lopdf = { version = "0.47.0", default-features = false }
lyon_tessellation = "1.0.23"
moxcms = "0.8"
pdf-writer = "0.15.0"
pollster = "1.0.1"
qrcodegen = "1.8.0"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
rfd = "0.17.2"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
spellbook = "0.4"
subsetter = "0.2"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
ureq = "3.5.1"
usvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
visioncortex = "0.8"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wl-clipboard-rs = "0.9"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
